<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden Truck Workshop - The Green Thumb Journal</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; background: #f1f8e9; text-align: center; }
  h2 { color: #2e7d32; }
  #car { width: 220px; margin: 30px auto 10px; }
  #glass { width: 100px; height: 40px; margin: auto; background: #81d4fa;
           clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%); }
  #body { width: 220px; height: 45px; background: #7cb342; }
  #tyres { display: flex; justify-content: space-around; align-items: flex-start; height: 90px; }
  .tyre { width: 50px; height: 50px; background: #1a237e; border-radius: 50%; }
  button { margin: 5px; padding: 8px 12px; cursor: pointer; }
</style>
<script>
$(document).ready(function () {
  let bodyColors  = ['#7cb342', '#e53935', '#fdd835', '#8e24aa', '#fb8c00'];
  let glassColors = ['#81d4fa', '#455a64', '#b0bec5', '#263238'];
  let b = 0, g = 0;

  $('#glassBtn').click(function () {
    g = (g + 1) % glassColors.length;
    $('#glass').css('background', glassColors[g]);
  });

  $('#bodyBtn').click(function () {
    b = (b + 1) % bodyColors.length;
    $('#body').css('background', bodyColors[b]);
  });

  $('#bigBtn').click(function () {
    let size = $('.tyre').width();
    if (size < 80) $('.tyre').css({ width: size + 10, height: size + 10 });
  });

  $('#smallBtn').click(function () {
    let size = $('.tyre').width();
    if (size > 30) $('.tyre').css({ width: size - 10, height: size - 10 });
  });

  $('#reset').click(function () {
    b = 0; g = 0;
    $('#body').css('background', bodyColors[0]);
    $('#glass').css('background', glassColors[0]);
    $('.tyre').css({ width: 50, height: 50 });
  });
});
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <span class="brand">🌿 The Green Thumb Journal</span>
    <a href="index.html">Home</a>
    <a href="q1_budget_calculator.html">Budget Calculator</a>
    <a href="q2_plant_shop.html">Plant Shop</a>
    <a href="q3_garden_truck_workshop.html" class="active">Truck Workshop</a>
  </div>
  <h2>The Green Thumb Journal - Garden Truck Workshop</h2>

  <div id="car">
    <div id="glass"></div>
    <div id="body"></div>
    <div id="tyres">
      <div class="tyre"></div>
      <div class="tyre"></div>
    </div>
  </div>

  <button id="glassBtn">Change Glass Color</button>
  <button id="bodyBtn">Change Body Color</button>
  <button id="bigBtn">Tyre Size Increase</button>
  <button id="smallBtn">Tyre Size Decrease</button>
  <button id="reset">Reset</button>
</body>
</html>
